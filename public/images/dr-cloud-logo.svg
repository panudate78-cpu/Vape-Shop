<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Dr Cloud - The Mobile & Vape Store">
  <!-- Pure black background -->
  <rect width="1000" height="520" fill="#000"/>
  <!--
    Dr Cloud logo, drawn from the user-supplied reference:
    - 5-lobed white cartoon cloud (symmetric: small top, 2 big side, 2 small bottom)
    - "DR CLOUD" in black bold sans-serif, the 'O' is a LARGE CIRCLE (thick ring)
      that sits higher and bigger than the baseline letters (its top is near the
      top of the cloud, its bottom hangs near the tagline line)
    - "THE MOBILE & VAPE STORE" in smaller spaced black caps INSIDE the cloud
  -->

  <!-- White cloud body (5 lobes, built from overlapping circles + a horizontal pill) -->
  <g fill="#fff">
    <!-- bottom pill base -->
    <rect x="60" y="180" width="880" height="260" rx="130" ry="130"/>
    <!-- left lobe -->
    <circle cx="180" cy="300" r="130"/>
    <!-- right lobe -->
    <circle cx="820" cy="300" r="130"/>
    <!-- top-left hump -->
    <circle cx="330" cy="195" r="120"/>
    <!-- top-center (tallest) hump -->
    <circle cx="500" cy="170" r="145"/>
    <!-- top-right hump -->
    <circle cx="670" cy="195" r="120"/>
    <!-- bottom-left lobe -->
    <circle cx="370" cy="410" r="105"/>
    <!-- bottom-right lobe -->
    <circle cx="630" cy="410" r="105"/>
    <!-- fill-in rect so the base connects cleanly -->
    <rect x="180" y="180" width="640" height="230" fill="#fff"/>
  </g>

  <!-- Black text: "DR CLOUD" with the big stylised O -->
  <g fill="#000" font-family="Arial Black, Helvetica Neue Bold, sans-serif" font-weight="900" text-anchor="middle">
    <!-- D -->
    <text x="170" y="330" font-size="170" text-anchor="middle">D</text>
    <!-- R -->
    <text x="295" y="330" font-size="170" text-anchor="middle">R</text>
    <!-- C -->
    <text x="420" y="330" font-size="170" text-anchor="middle">C</text>
    <!-- L -->
    <text x="520" y="330" font-size="170" text-anchor="middle">L</text>
    <!-- Big stylised O: a thick ring, oversized and raised higher than other letters -->
    <g transform="translate(600,275)">
      <circle cx="0" cy="0" r="82" fill="#000"/>
      <circle cx="0" cy="0" r="40" fill="#fff"/>
    </g>
    <!-- U -->
    <text x="720" y="330" font-size="170" text-anchor="middle">U</text>
    <!-- D (end) -->
    <text x="845" y="330" font-size="170" text-anchor="middle">D</text>
  </g>

  <!-- Tagline inside the cloud -->
  <text x="500" y="400" fill="#000" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="42" letter-spacing="8" text-anchor="middle">
    THE MOBILE &amp; VAPE STORE
  </text>
</svg>
